<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Farm Baby Playdates{% endblock %} · Gooseberry Bridge Farm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top"><div class="in">
  <div class="brand"><small>Gooseberry Bridge Farm</small><b>{% block heading %}Farm Baby Playdates{% endblock %}</b></div>
  {% block nav %}{% endblock %}
</div></header>
<main class="wrap {% block wrapclass %}narrow{% endblock %}">
  {% with msgs = get_flashed_messages() %}{% for m in msgs %}<div class="flash" role="status">{{ m }}</div>{% endfor %}{% endwith %}
  {% block body %}{% endblock %}
</main>
</body>
</html>
