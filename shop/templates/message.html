{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block wrapclass %}narrow{% endblock %}
{% block body %}
<section class="card"><h1>{{ title }}</h1>{% for para in (body or '').split('\n\n') %}<p style="margin:0">{{ para }}</p>{% endfor %}
{% if link %}<a class="btn" href="{{ link }}">{{ link_text }}</a>{% endif %}</section>
{% endblock %}
